<style>
  :root {
    --azul:      #1f3864;
    --azul-alto: #2a4d8f;
    --azul-suave:#eef2f9;
    --borde:     #dfe3ea;
    --texto:     #22262e;
    --tenue:     #6b7382;
    --fondo:     #f4f6fa;
    --verde:     #1d7a4c;
    --rojo:      #b3261e;
    --ambar:     #9a6700;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ---------- Encabezado ---------- */
  header.barra {
    background: var(--azul);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(15, 30, 60, .18);
  }
  .marca      { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
  .marca span { display: block; font-size: 12px; font-weight: 400; color: #b9c6de; letter-spacing: 0; }
  .usuario    { text-align: right; font-size: 12.5px; color: #d6e0f0; }
  .usuario b  { display: block; color: #fff; font-size: 14px; }

  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }

  /* ---------- Tarjetas ---------- */
  .tarjeta {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .tarjeta h2 { margin: 0 0 4px; font-size: 16px; color: var(--azul); }
  .tarjeta p.sub { margin: 0; color: var(--tenue); font-size: 13px; }

  /* ---------- Cabecera de periodo ---------- */
  .periodo {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  }
  .dato {
    background: var(--azul-suave);
    border: 1px solid #d8e0ef;
    border-radius: 8px;
    padding: 8px 14px;
    min-width: 96px;
  }
  .dato label { display: block; font-size: 11px; text-transform: uppercase;
                letter-spacing: .5px; color: var(--tenue); margin-bottom: 2px; }
  .dato b { font-size: 15px; color: var(--azul); }
  .dato.crece { flex: 1 1 220px; }

  select.semana {
    border: 1px solid #d8e0ef; border-radius: 8px; padding: 9px 10px;
    font: inherit; background: #fff; color: var(--texto); min-width: 230px;
  }

  /* ---------- Campos ---------- */
  .campo { margin-bottom: 20px; }
  .campo > label.titulo {
    display: block; font-weight: 600; color: var(--azul); margin-bottom: 3px; font-size: 14px;
  }
  .campo .ayuda { color: var(--tenue); font-size: 12.5px; margin-bottom: 7px; }

  textarea, input[type="text"] {
    width: 100%; font: inherit; color: var(--texto);
    border: 1px solid var(--borde); border-radius: 8px; padding: 9px 11px;
    background: #fff; resize: vertical;
  }
  textarea:focus, input[type="text"]:focus, select:focus {
    outline: none; border-color: var(--azul-alto);
    box-shadow: 0 0 0 3px rgba(42, 77, 143, .13);
  }

  /* ---------- Tablas dinámicas ---------- */
  .tabla-envoltura { overflow-x: auto; border: 1px solid var(--borde); border-radius: 8px; }
  table.dinamica { border-collapse: collapse; width: 100%; min-width: 520px; }
  table.dinamica th {
    background: var(--azul-suave); color: var(--azul); text-align: left;
    font-size: 12px; text-transform: uppercase; letter-spacing: .4px;
    padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap;
  }
  table.dinamica td { padding: 5px 6px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
  table.dinamica tr:last-child td { border-bottom: 0; }
  table.dinamica input { border: 1px solid transparent; background: transparent; padding: 7px 8px; }
  table.dinamica input:focus { background: #fff; border-color: var(--azul-alto); }
  table.dinamica td.acciones { width: 38px; text-align: center; }
  .vacia td { color: var(--tenue); font-style: italic; padding: 12px; text-align: center; }

  /* ---------- Botones ---------- */
  button {
    font: inherit; border-radius: 8px; border: 1px solid transparent;
    padding: 9px 16px; cursor: pointer; transition: background .15s, border-color .15s;
  }
  button.primario   { background: var(--azul); color: #fff; font-weight: 600; }
  button.primario:hover   { background: var(--azul-alto); }
  button.secundario { background: #fff; color: var(--azul); border-color: #cfd8e8; }
  button.secundario:hover { background: var(--azul-suave); }
  button.fila       { background: transparent; color: var(--rojo); border: 0; padding: 4px 6px;
                      font-size: 16px; line-height: 1; }
  button.agregar    { background: #fff; color: var(--azul); border: 1px dashed #b9c6de;
                      margin-top: 8px; font-size: 13px; padding: 7px 12px; }
  button.agregar:hover { background: var(--azul-suave); }
  button:disabled   { opacity: .55; cursor: not-allowed; }

  .acciones-pie {
    position: sticky; bottom: 0; background: rgba(244, 246, 250, .95);
    backdrop-filter: blur(4px); padding: 12px 0 4px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--borde); margin-top: 8px;
  }

  /* ---------- Avisos ---------- */
  .aviso { border-radius: 8px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 14px; }
  .aviso.info  { background: var(--azul-suave); color: var(--azul);  border: 1px solid #d8e0ef; }
  .aviso.ok    { background: #e8f5ee; color: var(--verde); border: 1px solid #bfe3ce; }
  .aviso.error { background: #fdecea; color: var(--rojo);  border: 1px solid #f5c6c2; }
  .aviso.alerta{ background: #fff6e0; color: var(--ambar); border: 1px solid #f0dca6; }
  .oculto { display: none !important; }

  .cargando { color: var(--tenue); font-size: 13.5px; }

  /* ---------- Adjuntos y tablas pegadas ---------- */
  .zona-adjunto {
    border: 2px dashed #c3cee2; border-radius: 10px; background: #fbfcfe;
    padding: 18px 16px; text-align: center; cursor: pointer; color: var(--tenue);
    font-size: 13.5px; transition: background .15s, border-color .15s;
  }
  .zona-adjunto:hover, .zona-adjunto:focus, .zona-adjunto.sobre {
    background: var(--azul-suave); border-color: var(--azul-alto); outline: none;
  }
  /* La zona que recibirá el próximo Ctrl+V: sin esta señal, con dos recuadros
     en el mismo formulario, el usuario no sabe dónde va a caer lo que pegue. */
  .zona-adjunto.activa {
    background: var(--azul-suave); border-color: var(--azul-alto);
    border-style: solid; box-shadow: 0 0 0 3px rgba(0, 87, 165, .10);
  }
  .zona-adjunto.esperando { animation: latido 1s ease-in-out 3; }
  @keyframes latido {
    0%, 100% { box-shadow: 0 0 0 3px rgba(0, 87, 165, .10); }
    50%      { box-shadow: 0 0 0 7px rgba(0, 87, 165, .22); }
  }
  .zona-adjunto b { color: var(--azul); }
  .barra-adjunto { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pista { font-size: 12px; color: var(--tenue); margin-top: 4px; }

  .lista-adjuntos { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .adjunto {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fff;
  }
  .adjunto img {
    width: 84px; height: 60px; object-fit: cover;
    border-radius: 6px; border: 1px solid var(--borde); background: #f7f9fc;
  }
  .adjunto .sin-vista {
    width: 84px; height: 60px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px solid var(--borde); background: #f7f9fc; font-size: 24px;
  }
  .adjunto .info { flex: 1; min-width: 0; }
  .adjunto .nombre {
    font-weight: 600; font-size: 13px; color: var(--texto);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .adjunto a { font-size: 12px; color: var(--azul-alto); }

  .etiqueta-comentario {
    display: block; margin: 12px 0 4px; font-size: 12.5px;
    font-weight: 600; color: var(--azul);
  }

  table.dinamica td.solo-lectura {
    padding: 7px 9px; font-size: 13px; color: var(--texto); white-space: nowrap;
  }
  table.dinamica select {
    width: 100%; font: inherit; border: 1px solid transparent;
    background: transparent; padding: 6px 6px; border-radius: 6px; color: var(--texto);
  }
  table.dinamica select:focus { background: #fff; border-color: var(--azul-alto); outline: none; }

  /* ---------- Panel del administrador: vista previa del correo ---------- */
  .destinatario {
    margin-top: 14px; font-size: 13px; color: var(--tenue);
    border-top: 1px solid var(--borde); padding-top: 12px;
  }
  .destinatario b { color: var(--texto); }
  .destinatario .falta { color: var(--rojo); font-weight: 600; }

  .sobre-cabecera {
    background: #fff; border: 1px solid var(--borde); border-bottom: 0;
    border-radius: 10px 10px 0 0; padding: 14px 18px; font-size: 13px; color: var(--tenue);
  }
  .sobre-cabecera .fila { display: flex; gap: 8px; padding: 2px 0; }
  .sobre-cabecera .etq { min-width: 62px; color: var(--tenue); }
  .sobre-cabecera .val { color: var(--texto); font-weight: 600; word-break: break-word; }
  .sobre-cuerpo {
    border: 1px solid var(--borde); border-radius: 0 0 10px 10px;
    overflow: hidden; background: #f4f6fa;
  }

  @media (max-width: 640px) {
    header.barra { padding: 12px 14px; }
    .usuario { text-align: left; }
    main { padding: 14px 10px 60px; }
    .tarjeta { padding: 14px; }
  }
</style>
